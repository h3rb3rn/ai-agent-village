services:
  chromadb:
    image: ${CHROMA_IMAGE:-chromadb/chroma:latest}
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - ${VILLAGE_MEMORY_ROOT:-/var/lib/ai-village/memory}/chroma:/data
    ports:
      - "127.0.0.1:8000:8000"
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:community}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?set NEO4J_AUTH in a private env file}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - ${VILLAGE_MEMORY_ROOT:-/var/lib/ai-village/memory}/neo4j/data:/data
      - ${VILLAGE_MEMORY_ROOT:-/var/lib/ai-village/memory}/neo4j/logs:/logs
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
